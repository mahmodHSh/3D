<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة تكلفة الطباعة ثلاثية الأبعاد</title>
<style>
/* ===== CSS: الألوان والخطوط ===== */
:root{--bg:#0d1017;--pn:#151a24;--pn2:#1c2230;--bd:#2a3244;--tx:#e8ecf4;--mu:#93a0b8;--ac:#5cc8ff;--ac2:#8b7cf6;--ok:#4cd79a;--wr:#f4b94a;--er:#ff6b7a}
[data-theme=light]{--bg:#f3f5fa;--pn:#fff;--pn2:#eef1f8;--bd:#d3d9e6;--tx:#161b27;--mu:#5a6580;--ac:#0a7ec2;--ac2:#5b4bd6;--ok:#0b8a5a;--wr:#a86a00;--er:#c42b3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--pn);border-inline-end:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:16px;margin:0 8px 16px;color:var(--ac)}
nav button{display:block;width:100%;text-align:start;background:none;border:0;color:var(--mu);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:var(--pn2);color:var(--tx)}
nav button.on{box-shadow:inset -3px 0 var(--ac)}
main{flex:1;padding:24px;max-width:1100px;min-width:0}
h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 10px;font-size:16px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;margin-top:3px}
input[type=checkbox]{width:auto}
button.b{background:var(--ac);color:#04121c;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--pn2);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er);color:#fff}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:36px;text-align:center;color:var(--mu);cursor:pointer;transition:.2s}
.drop.ov{border-color:var(--ac);background:var(--pn2)}
#vw{height:340px;border-radius:12px;background:var(--pn2);position:relative;overflow:hidden}
.warn{border-inline-start:4px solid var(--wr);background:var(--pn2);padding:10px 12px;border-radius:8px;margin:8px 0;color:var(--wr)}
.note{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pn2);border:1px solid var(--bd);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:start;font-size:14px}
.tot td{font-weight:700;color:var(--ac);font-size:17px}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;display:grid;gap:8px;z-index:9}
#toast div{background:var(--pn);border:1px solid var(--bd);padding:10px 14px;border-radius:8px;animation:in .25s}
#toast .e{border-color:var(--er)}#toast .k{border-color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r .8s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav button{white-space:nowrap;width:auto}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* لمسات التحسين */
.card{box-shadow:0 10px 28px -18px rgba(0,0,0,.55)}
button{transition:background .15s,transform .1s,border-color .15s,filter .15s}
button.b:hover{filter:brightness(1.1)}button.b:active{transform:scale(.97)}
button.s:hover{border-color:var(--ac)}
button.d{background:transparent;color:var(--er);border:1px solid var(--er)}
button.d:hover{background:var(--er);color:#fff}
.sm{padding:6px 14px;font-size:13px;min-width:78px;line-height:1.5}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap;white-space:nowrap}
td.ac{width:1%}
.tw{overflow-x:auto}
td{vertical-align:middle}
input:focus,select:focus{border-color:var(--ac);outline:none}
.stat{border-top:3px solid var(--ac2)}
.drop:hover{border-color:var(--ac);color:var(--tx)}
details.card summary{cursor:pointer;font-weight:600}
@media(max-width:760px){.sm{min-width:68px;padding:6px 10px}h2{font-size:19px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>

<!-- مكتبات CDN: Three.js + محمّلات STL/OBJ/3MF + OrbitControls + JSZip (لـ 3MF). العرض ثلاثي الأبعاد يحتاج إنترنت أول مرة. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3MFLoader.js"></script>
<script>
'use strict';
/* ===== 1) التخزين المحلي (localStorage: بيانات وصفية فقط، بلا ملفات) ===== */
const KEY='p3dcalc.v1';
const DEF=()=>({fil:[],hist:[],
 prn:[{id:'def',name:'طابعة افتراضية للتقدير',w:220,d:220,h:250,nozzle:0.4,fd:1.75,kwh:'',watt:150,prof:''}],
 set:{theme:'dark',cur:'₪',waste:5,kwh:0.6,api:'http://localhost:8787'},
 pf:{prn:'def',fil:'',layer:0.2,infill:15,walls:3,top:4,bot:4,sup:false,copies:1,nt:210,bt:60,spd:50,mw:'',mh:'',extra:0,mhc:0,fix:0}});
let S=DEF();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){const d=DEF();S={...d,...j,set:{...d.set,...j.set},pf:{...d.pf,...j.pf}};}}catch(e){toast('تعذّرت قراءة البيانات المحفوظة؛ تم استخدام الإعدادات الافتراضية','e')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ (الذاكرة ممتلئة أو ممنوعة)','e')}}

/* ===== 2) أدوات عامة ===== */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>fmt(n)+' '+esc(S.set.cur);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m,t='k'){const d=document.createElement('div');d.className=t;d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),4500)}
function nv(id,{min=0,max=1e9,req=true,gt0=false}={}){const el=$('#'+id);const v=el.value.trim();if(v===''){if(req)throw new Error('حقل فارغ: '+el.previousSibling?.textContent);return ''}const n=Number(v);if(!isFinite(n)||n<min||n>max||(gt0&&n<=0))throw new Error('قيمة غير صالحة في: '+(el.parentElement.firstChild.textContent||id));return n}

/* ===== 3) محرك الحساب (دوال مستقلة) ===== */
const pricePerGram=f=>f.price/f.wt; // سعر الغرام = سعر البكرة ÷ وزن البكرة
function estimateWeight(m,pf,p,f){ // تقدير هندسي تقريبي: جدران + طبقات علوية/سفلية + تعبئة. لا يحاكي الدعامات ولا الجسور.
 if(!m||!f.density)return null;
 const vol=m.vol,area=m.area;
 const shell=Math.min(vol,area*pf.walls*p.nozzle);
 const tb=Math.min(Math.max(0,vol-shell),area*0.5*(pf.top+pf.bot)*pf.layer);
 const inner=Math.max(0,vol-shell-tb)*pf.infill/100;
 return (shell+tb+inner)/1000*f.density; // مم³→سم³ × كثافة غ/سم³
}
function computeCost({w,hours,f,p,pf,set,source}){ // w: غرام لكل نسخة
 const ppg=pricePerGram(f),n=pf.copies;
 const mat=w*n*ppg,waste=mat*set.waste/100;
 const t=hours===''||hours==null?null:hours*n;
 const watt=p.watt===''?null:p.watt, kp=p.kwh!==''&&p.kwh!=null?p.kwh:set.kwh;
 const kwh=(t!=null&&watt!=null)?watt*t/1000:null;
 const elec=kwh!=null?kwh*kp:0, mach=t!=null?t*pf.mhc:0;
 const total=mat+waste+elec+mach+pf.extra+pf.fix;
 return {w,wTotal:w*n,ppg,mat,waste,t,kwh,elec,mach,extra:pf.extra,fix:pf.fix,total,source};
}

/* ===== 4) عارض Three.js وقراءة الملفات ===== */
let cur=null,R=null; // cur: النموذج الحالي في الذاكرة
function ensureViewer(){
 if(R||!window.THREE||!THREE.OrbitControls)return R;
 const r=new THREE.WebGLRenderer({antialias:true});const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,0.1,1e5);
 sc.add(new THREE.AmbientLight(0xffffff,.55));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(1,2,3);sc.add(dl);
 sc.add(new THREE.GridHelper(300,30,0x5cc8ff,0x334));
 const ctl=new THREE.OrbitControls(cam,r.domElement);R={r,sc,cam,ctl,mesh:null};
 (function loop(){requestAnimationFrame(loop);if(R.el&&R.el.isConnected){const w=R.el.clientWidth,h=R.el.clientHeight;if(r.domElement.width!==w*devicePixelRatio){r.setPixelRatio(devicePixelRatio);r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}ctl.update();r.render(sc,cam)}})();
 return R;
}
function mountViewer(){const v=ensureViewer();const el=$('#vw');if(!el)return;if(!v){el.textContent='تعذّر تحميل Three.js (يلزم اتصال بالإنترنت). الحسابات تعمل بدونه.';el.style.padding='20px';return}v.el=el;el.append(v.r.domElement)}
function resetView(){if(!R||!cur)return;const b=cur.box,c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()).length();R.cam.position.set(c.x+s,c.y-s,c.z+s*.8);R.cam.up.set(0,0,1);R.ctl.target.copy(c);R.ctl.update()}
function geoStats(g){ // الحجم (مم³) عبر الحجم الموقّع للمثلثات + مساحة السطح
 const p=g.attributes.position.array,ix=g.index?g.index.array:null,n=(ix?ix.length:p.length/3)/3;let vol=0,area=0;
 const V=i=>{const k=(ix?ix[i]:i)*3;return[p[k],p[k+1],p[k+2]]};
 for(let t=0;t<n;t++){const a=V(t*3),b=V(t*3+1),c=V(t*3+2);
  vol+=(a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
  const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  area+=Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx)/2}
 return{vol:Math.abs(vol),area,tris:n};
}
function mergeObject(o){ // دمج كل شبكات المجموعة في هندسة واحدة غير مفهرسة
 o.updateMatrixWorld(true);const parts=[];let len=0;
 o.traverse(m=>{if(m.isMesh){let g=m.geometry.clone();g=g.index?g.toNonIndexed():g;g.applyMatrix4(m.matrixWorld);parts.push(g.attributes.position.array);len+=parts.at(-1).length}});
 if(!parts.length)throw new Error('لا توجد أسطح في الملف');
 const out=new Float32Array(len);let k=0;parts.forEach(a=>{out.set(a,k);k+=a.length});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(out,3));return g;
}
async function readModel(file){
 const ext=file.name.split('.').pop().toLowerCase();
 if(!['stl','obj','3mf'].includes(ext))throw new Error('الامتداد غير مدعوم. المسموح: STL و OBJ و 3MF');
 if(file.size===0)throw new Error('الملف فارغ');
 if(file.size>150*1048576)throw new Error('الملف أكبر من 150 ميغابايت؛ تم رفضه لحماية المتصفح');
 if(!window.THREE)throw new Error('مكتبة Three.js غير محمّلة (تحتاج إنترنت)');
 const buf=await file.arrayBuffer();let g;
 if(ext==='stl'){if(!THREE.STLLoader)throw new Error('محمّل STL غير متاح');g=new THREE.STLLoader().parse(buf)}
 else if(ext==='obj'){if(!THREE.OBJLoader)throw new Error('محمّل OBJ غير متاح');g=mergeObject(new THREE.OBJLoader().parse(new TextDecoder().decode(buf)))}
 else{if(!THREE.ThreeMFLoader||!window.JSZip)throw new Error('محمّل 3MF غير متاح (يحتاج JSZip)');g=mergeObject(new THREE.ThreeMFLoader().parse(buf))}
 if(!g.attributes.position||g.attributes.position.count<3)throw new Error('الملف تالف أو لا يحتوي مثلثات');
 g.computeBoundingBox();const st=geoStats(g);
 const box=g.boundingBox,sz=box.getSize(new THREE.Vector3());
 if(![sz.x,sz.y,sz.z].every(isFinite)||st.vol<=0)throw new Error('الشبكة غير صالحة (حجم صفري أو قيم تالفة)');
 return{name:file.name,size:file.size,geo:g,box,dims:[sz.x,sz.y,sz.z],...st,ext,file};
}
function showModel(m){
 const v=ensureViewer();if(!v)return;if(v.mesh){v.sc.remove(v.mesh);v.mesh.geometry.dispose()}
 const g=m.geo.clone();g.computeVertexNormals();v.mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8b7cf6,metalness:.1,roughness:.55}));v.sc.add(v.mesh);resetView();
}

/* ===== 5) الاتصال بمحرك التقطيع (واجهة API محلية) ===== */
// الخادم المتوقع: POST {api}/slice (multipart: model + config JSON) ← JSON {weight_g, time_s}  |  GET {api}/health
const Slicer={
 base:()=>S.set.api.replace(/\/$/,''),
 async health(){const r=await fetch(this.base()+'/health',{signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error('HTTP '+r.status);return true},
 async slice(file,cfg){const fd=new FormData();fd.append('model',file);fd.append('config',JSON.stringify(cfg));
  const r=await fetch(this.base()+'/slice',{method:'POST',body:fd,signal:AbortSignal.timeout(600000)});
  if(!r.ok)throw new Error('رد الخادم: '+r.status);const j=await r.json();
  if(!(j.weight_g>0)||!(j.time_s>0))throw new Error('نتيجة الخادم غير صالحة');return{w:j.weight_g,hours:j.time_s/3600}}
};

/* ===== 6) الواجهة ===== */
const VIEWS={dash:'لوحة التحكم',new:'تحليل جديد',fil:'الخامات',prn:'الطابعات',hist:'السجل',set:'الإعدادات'};
let view='dash',slicerRes=null,lastRes=null;
function go(v){view=v;render()}
function render(){
 document.documentElement.dataset.theme=S.set.theme;
 $('#nav').innerHTML='<h1>حاسبة الطباعة 3D</h1>'+Object.entries(VIEWS).map(([k,t])=>`<button data-v="${k}" class="${k===view?'on':''}">${t}</button>`).join('');
 $('#main').innerHTML=({dash:vDash,new:vNew,fil:vFil,prn:vPrn,hist:vHist,set:vSet})[view]();
 if(view==='new'){mountViewer();if(cur)showModel(cur)}
}
function vDash(){
 const h=S.hist,w=h.reduce((a,x)=>a+x.wTotal,0),c=h.reduce((a,x)=>a+x.total,0);
 return `<h2>لوحة التحكم</h2><div class="grid">
 <div class="card stat"><b>${h.length}</b><span>تصاميم محلَّلة</span></div>
 <div class="card stat"><b>${money(c)}</b><span>إجمالي التكلفة التقديرية للمحفوظ</span></div>
 <div class="card stat"><b>${fmt(w,1)} غ</b><span>إجمالي وزن الخامة</span></div>
 <div class="card stat"><b>${S.fil.length}</b><span>خامات محفوظة</span></div></div>
 <div class="warn">نتائج التقطيع الفعلية غير متاحة ما لم يكن خادم التقطيع المحلي متصلًا؛ الحسابات الحالية يدوية أو تقدير هندسي.</div>
 <div class="card"><h3>آخر التحليلات</h3>${h.length?'<table>'+h.slice(-5).reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.total)}</td><td>${esc(x.source)}</td></tr>`).join('')+'</table>':'<p class="note">لا توجد تحليلات بعد.</p>'}
 <div class="row"><button class="b" data-v="new">تحليل جديد</button></div></div>`;
}
const PF=[['layer','ارتفاع الطبقة (مم)',.01,.05,1],['infill','التعبئة %',1,0,100],['walls','عدد الجدران',1,1,20],['top','طبقات علوية',1,0,50],['bot','طبقات سفلية',1,0,50],['copies','عدد النسخ',1,1,1000],['nt','حرارة الفوهة °م',1,0,500],['bt','حرارة السرير °م',1,0,200],['spd','السرعة (مم/ث)',1,1,1000]];
const opt=(a,sel,l)=>a.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(l(x))}</option>`).join('');
function vNew(){
 const pf=S.pf;
 return `<h2>تحليل تصميم جديد</h2>
 <div class="card"><div class="drop" id="drop" tabindex="0">اسحب ملف STL أو OBJ أو 3MF هنا، أو اضغط للاختيار<input type="file" id="file" accept=".stl,.obj,.3mf" hidden></div><div id="fi" class="note"></div></div>
 <div class="card"><div id="vw"></div><div class="row"><button class="b s" data-a="rv">إعادة العرض</button></div><div id="dm">${dimHtml()}</div></div>
 <div class="card"><h3>إعدادات الطباعة</h3><p class="note">قيم ابتدائية وليست مضمونة لكل طابعة وخامة. المطبَّق في التقدير: الطبقة والتعبئة والجدران والطبقات العلوية/السفلية والنسخ. الباقي (الدعامات والحرارة والسرعة) يُحفظ ويُرسل للمقطّع فقط.</p>
 <div class="grid"><label>الطابعة<select id="pf_prn">${opt(S.prn,pf.prn,x=>x.name)}</select></label>
 <label>الخامة<select id="pf_fil">${S.fil.length?opt(S.fil,pf.fil,x=>x.name+' ('+x.type+')'):'<option value="">أضف خامة أولًا</option>'}</select></label>
 ${PF.map(([k,l,s,mn,mx])=>`<label>${l}<input id="pf_${k}" type="number" step="${s}" min="${mn}" max="${mx}" value="${pf[k]}"></label>`).join('')}
 <label>دعامات<br><input id="pf_sup" type="checkbox" ${pf.sup?'checked':''}> مفعّلة (لا تُحاكى في التقدير)</label></div>
 <h3 style="margin-top:14px">وزن/وقت يدوي وتكاليف إضافية (اختياري)</h3>
 <div class="grid"><label>وزن النسخة اليدوي (غ)<input id="pf_mw" type="number" step="0.1" min="0" value="${pf.mw}"></label>
 <label>زمن الطباعة للنسخة (ساعة)<input id="pf_mh" type="number" step="0.05" min="0" value="${pf.mh}"></label>
 <label>تكاليف إضافية<input id="pf_extra" type="number" step="0.1" min="0" value="${pf.extra}"></label>
 <label>تكلفة ساعة تشغيل الطابعة<input id="pf_mhc" type="number" step="0.1" min="0" value="${pf.mhc}"></label>
 <label>تكلفة ثابتة لكل عملية<input id="pf_fix" type="number" step="0.1" min="0" value="${pf.fix}"></label></div>
 <div class="row"><button class="b" data-a="calc">احسب التكلفة</button><button class="b s" data-a="slice" id="bs">قطّع عبر الخادم المحلي</button></div></div>
 <div id="res"></div>`;
}
function dimHtml(){if(!cur)return '<p class="note">لم يُرفع ملف بعد.</p>';const p=S.prn.find(x=>x.id===S.pf.prn);
 const over=p&&(cur.dims[0]>p.w||cur.dims[1]>p.d||cur.dims[2]>p.h);
 return `<p>الأبعاد: ${cur.dims.map(d=>fmt(d,1)).join(' × ')} مم (افتراضًا أن الوحدة مم — تأكد منها، فملفات STL لا تحمل وحدة) · الحجم ${fmt(cur.vol/1000,2)} سم³ · المثلثات ${cur.tris.toLocaleString()}</p>`+(over?`<div class="warn">النموذج أكبر من مساحة الطباعة (${p.w}×${p.d}×${p.h} مم).</div>`:'')+(cur.tris>1.5e6?'<div class="warn">نموذج كبير جدًا؛ قد يبطئ المتصفح.</div>':'');}
function readPF(){
 const pf={...S.pf};pf.prn=$('#pf_prn').value;pf.fil=$('#pf_fil').value;pf.sup=$('#pf_sup').checked;
 PF.forEach(([k,,,mn,mx])=>pf[k]=nv('pf_'+k,{min:mn,max:mx}));
 pf.mw=nv('pf_mw',{req:false});pf.mh=nv('pf_mh',{req:false});pf.extra=nv('pf_extra');pf.mhc=nv('pf_mhc');pf.fix=nv('pf_fix');
 if(!pf.fil)throw new Error('اختر خامة (أضفها من قسم الخامات)');
 S.pf=pf;save();return pf;
}
function doCalc(slice){
 try{
  const pf=readPF(),f=S.fil.find(x=>x.id===pf.fil),p=S.prn.find(x=>x.id===pf.prn);
  const notes=[];if(f.dia!==p.fd)notes.push(`قطر الخامة (${f.dia}) يختلف عن القطر المدعوم في الطابعة (${p.fd}).`);
  let w,hours,src;
  if(slice){w=slice.w;hours=slice.hours;src='تقطيع فعلي'}
  else if(pf.mw!==''){w=pf.mw;hours=pf.mh;src='حساب يدوي'}
  else{if(!cur)throw new Error('ارفع نموذجًا أو أدخل وزنًا يدويًا');
   if(!f.density)throw new Error('أدخل كثافة الخامة أو وزنًا يدويًا للتقدير الهندسي');
   w=estimateWeight(cur,pf,p,f);hours=pf.mh;src='تقدير هندسي';notes.push('الوزن تقدير تقريبي ولا يشمل الدعامات أو الجسور.')}
  const r=computeCost({w,hours,f,p,pf,set:S.set,source:src});
  r.hours=hours===''?null:hours;if(r.t==null)notes.push('زمن الطباعة غير متوفر، لذا لم تُحسب الكهرباء وتكلفة التشغيل.');
  r.notes=notes;r.f=f;r.p=p;r.pf=pf;lastRes=r;showRes(r);
 }catch(e){toast(e.message,'e')}
}
function showRes(r){
 const rel={'تقطيع فعلي':'مصدرها محرك تقطيع حقيقي.','حساب يدوي':'تعتمد على ما أدخلته أنت.','تقدير هندسي':'تقريبية وقد تختلف كثيرًا عن التقطيع الفعلي.'}[r.source];
 $('#res').innerHTML=`<div class="card"><h3>النتيجة <span class="tag">${esc(r.source)}</span></h3><table>
 <tr><td>الملف</td><td>${esc(cur?cur.name:'—')}</td></tr><tr><td>الخامة</td><td>${esc(r.f.name)} (${esc(r.f.type)})</td></tr>
 <tr><td>وزن النسخة / الإجمالي</td><td>${fmt(r.w,1)} غ / ${fmt(r.wTotal,1)} غ</td></tr><tr><td>سعر الغرام</td><td>${fmt(r.ppg,4)} ${esc(S.set.cur)}</td></tr>
 <tr><td>تكلفة الخامة</td><td>${money(r.mat)}</td></tr><tr><td>الهدر (${S.set.waste}%)</td><td>${money(r.waste)}</td></tr>
 <tr><td>وقت الطباعة</td><td>${r.t!=null?fmt(r.t,2)+' ساعة':'غير متوفر'}</td></tr>
 <tr><td>الكهرباء</td><td>${r.kwh!=null?money(r.elec)+' ('+fmt(r.kwh,3)+' ك.و.س)':'غير متوفرة'}</td></tr>
 <tr><td>تشغيل الطابعة / ثابتة / إضافية</td><td>${money(r.mach)} / ${money(r.fix)} / ${money(r.extra)}</td></tr>
 <tr class="tot"><td>الإجمالي</td><td>${money(r.total)}</td></tr></table>
 <div class="warn">الموثوقية: ${rel}${r.notes.map(n=>'<br>'+esc(n)).join('')}</div>
 <div class="row"><button class="b" data-a="saveh">حفظ في السجل</button></div></div>`;
}
function vFil(){return `<h2>الخامات</h2><div class="card"><h3>إضافة خامة</h3>${filForm()}</div><div class="card">${S.fil.length?'<div class="tw"><table><tr><th>الاسم</th><th>النوع</th><th>سعر الغرام</th><th></th></tr>'+S.fil.map(f=>`<tr><td>${esc(f.name)} ${f.color?`<span class="tag">${esc(f.color)}</span>`:''}</td><td>${esc(f.type)} ${f.dia}مم</td><td>${fmt(pricePerGram(f),4)} ${esc(S.set.cur)}</td><td class="ac"><div class="acts"><button class="b s sm" data-a="ef" data-id="${f.id}">✎ تعديل</button><button class="b d sm" data-a="df" data-id="${f.id}">✕ حذف</button></div></td></tr>`).join('')+'</table></div>':'<p class="note">لا توجد خامات. أضف أول خامة بسعرها الفعلي.</p>'}</div>`}
function filForm(f={}){return `<div class="grid"><label>الاسم<input id="f_name" maxlength="60" value="${esc(f.name)}"></label><label>الشركة<input id="f_brand" value="${esc(f.brand)}"></label>
 <label>النوع (PLA/PETG/ABS/TPU…)<input id="f_type" value="${esc(f.type||'PLA')}"></label><label>سعر البكرة<input id="f_price" type="number" step="0.01" min="0" value="${f.price??''}"></label>
 <label>وزن البكرة (غ)<input id="f_wt" type="number" min="0" value="${f.wt??1000}"></label><label>القطر (مم)<input id="f_dia" type="number" step="0.05" value="${f.dia??1.75}"></label>
 <label>الكثافة غ/سم³ (اختياري)<input id="f_den" type="number" step="0.01" min="0" value="${f.density??''}"></label><label>اللون<input id="f_color" value="${esc(f.color)}"></label>
 <label>ملاحظات<input id="f_note" value="${esc(f.note)}"></label></div><p class="note">الكثافة تُدخل من ورقة بيانات الخامة؛ لا يُفترض سعر ولا كثافة تلقائيًا.</p><div class="row"><button class="b" data-a="sf" data-id="${f.id||''}">${f.id?'حفظ التعديل':'إضافة'}</button></div>`}
function vPrn(){return `<h2>الطابعات</h2><div class="card"><h3>إضافة طابعة</h3>${prnForm()}</div><div class="card"><div class="tw"><table>${S.prn.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.w}×${p.d}×${p.h} مم · فوهة ${p.nozzle} · خيط ${p.fd}</td><td class="ac"><div class="acts"><button class="b s sm" data-a="ep" data-id="${p.id}">✎ تعديل</button><button class="b d sm" data-a="dp" data-id="${p.id}">✕ حذف</button></div></td></tr>`).join('')}</table></div><p class="note">«طابعة افتراضية للتقدير» ليست طابعة حقيقية ولا تطابق موديلًا معينًا.</p></div>`}
function prnForm(p={}){return `<div class="grid"><label>الاسم<input id="p_name" value="${esc(p.name)}"></label><label>عرض X (مم)<input id="p_w" type="number" min="1" value="${p.w??220}"></label><label>عمق Y<input id="p_d" type="number" min="1" value="${p.d??220}"></label><label>ارتفاع Z<input id="p_h" type="number" min="1" value="${p.h??250}"></label>
 <label>الفوهة (مم)<input id="p_nozzle" type="number" step="0.05" min="0.1" value="${p.nozzle??0.4}"></label><label>الخيط المدعوم<input id="p_fd" type="number" step="0.05" value="${p.fd??1.75}"></label>
 <label>استهلاك (واط)<input id="p_watt" type="number" min="0" value="${p.watt??''}"></label><label>سعر ك.و.س (يتجاوز العام)<input id="p_kwh" type="number" step="0.01" min="0" value="${p.kwh??''}"></label>
 <label>ملف إعدادات المقطّع (اسم/مسار)<input id="p_prof" value="${esc(p.prof)}"></label></div><div class="row"><button class="b" data-a="sp" data-id="${p.id||''}">${p.id?'حفظ التعديل':'إضافة'}</button></div>`}
let hq='',hs='date';
function vHist(){
 let h=S.hist.filter(x=>x.name.toLowerCase().includes(hq.toLowerCase()));h=h.sort((a,b)=>hs==='cost'?b.total-a.total:b.ts-a.ts);
 return `<h2>سجل التصاميم</h2><div class="card"><div class="row"><input id="hq" placeholder="بحث بالاسم" value="${esc(hq)}" style="max-width:240px"><select id="hs" style="max-width:180px"><option value="date" ${hs==='date'?'selected':''}>الأحدث</option><option value="cost" ${hs==='cost'?'selected':''}>الأعلى تكلفة</option></select><button class="b s" data-a="csv">تصدير CSV</button></div>
 ${h.length?h.map(x=>`<details class="card"><summary>${esc(x.name)} — ${money(x.total)} — ${new Date(x.ts).toLocaleDateString('ar')}</summary><p>الأبعاد: ${esc(x.dims)} · الخامة: ${esc(x.fil)} · الوزن: ${fmt(x.wTotal,1)} غ · المصدر: ${esc(x.source)}<br>الإعدادات: طبقة ${x.pf.layer} · تعبئة ${x.pf.infill}% · جدران ${x.pf.walls} · نسخ ${x.pf.copies}</p><div class="row"><button class="b s sm" data-a="reuse" data-id="${x.id}">↻ إعادة استخدام الإعدادات</button><button class="b d sm" data-a="dh" data-id="${x.id}">✕ حذف</button></div></details>`).join(''):'<p class="note">السجل فارغ.</p>'}</div>`}
function vSet(){const s=S.set;return `<h2>الإعدادات</h2><div class="card"><div class="grid"><label>الوضع<select id="s_theme"><option value="dark" ${s.theme==='dark'?'selected':''}>داكن</option><option value="light" ${s.theme==='light'?'selected':''}>فاتح</option></select></label>
 <label>العملة<input id="s_cur" maxlength="6" value="${esc(s.cur)}"></label><label>نسبة الهدر الافتراضية %<input id="s_waste" type="number" step="0.5" min="0" max="100" value="${s.waste}"></label>
 <label>سعر الكيلوواط ساعة<input id="s_kwh" type="number" step="0.01" min="0" value="${s.kwh}"></label><label>عنوان خادم التقطيع<input id="s_api" value="${esc(s.api)}" dir="ltr"></label></div>
 <p class="note">نسبة الهدر وسعر الكهرباء قيمتان ابتدائيتان قابلتان للتعديل وتظهران في كل نتيجة.</p>
 <div class="row"><button class="b" data-a="ss">حفظ</button><button class="b s" data-a="ping">اختبار اتصال الخادم</button><button class="b s" data-a="test">اختبارات الحساب</button></div></div>
 <div class="card"><h3>البيانات</h3><div class="row"><button class="b s" data-a="exp">تصدير JSON</button><button class="b s" data-a="imp">استيراد JSON</button><input type="file" id="impf" accept=".json" hidden><button class="b d" data-a="clr">مسح كل البيانات</button></div></div>
 <div class="card"><h3>غير مُنفَّذ في هذا الإصدار</h3><p class="note">تحويل الصور إلى نقش بارز، وتوليد مجسّم من صورة بالذكاء الاصطناعي: لم يُنفَّذا بعد. الثاني يحتاج خدمة خارجية ومفتاح API (لا يوضع داخل HTML) وموافقتك قبل إرسال أي صورة.</p></div>`}

/* ===== 7) الأحداث ===== */
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)};
const gv=id=>$('#'+id).value.trim();
function csvCell(v){v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
async function handleFile(file){
 const fi=$('#fi');fi.innerHTML='<span class="spin"></span> جارٍ المعالجة…';
 try{cur=await readModel(file);fi.textContent=`${cur.name} — ${fmt(cur.size/1048576,2)} ميغابايت`;showModel(cur);$('#dm').innerHTML=dimHtml();slicerRes=null;toast('تمت قراءة النموذج')}
 catch(e){cur=null;fi.textContent='';toast(e.message,'e')}
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,.drop');if(!t)return;
 if(t.dataset.v)return go(t.dataset.v);
 if(t.id==='drop')return $('#file').click();
 const a=t.dataset.a,id=t.dataset.id;
 try{switch(a){
 case'rv':resetView();break;
 case'calc':doCalc();break;
 case'slice':{if(!cur)throw new Error('ارفع نموذجًا أولًا');const pf=readPF();t.disabled=true;t.innerHTML='<span class="spin"></span> جارٍ التقطيع';
  try{const r=await Slicer.slice(cur.file,{printer:S.prn.find(x=>x.id===pf.prn),filament:S.fil.find(x=>x.id===pf.fil),print:pf});doCalc(r)}
  catch(err){toast('الخادم غير متصل أو فشل التقطيع ('+err.message+'). استخدم الحساب اليدوي؛ لم تُعرض نتيجة وهمية.','e')}
  t.disabled=false;t.textContent='قطّع عبر الخادم المحلي';break}
 case'saveh':{const r=lastRes;S.hist.push({id:uid(),ts:Date.now(),name:cur?cur.name:'إدخال يدوي',dims:cur?cur.dims.map(d=>fmt(d,1)).join('×')+' مم':'—',fil:r.f.name,wTotal:r.wTotal,total:r.total,source:r.source,pf:{...r.pf}});save();toast('تم الحفظ في السجل');break}
 case'sf':{const f={id:id||uid(),name:gv('f_name'),brand:gv('f_brand'),type:gv('f_type')||'PLA',price:nv('f_price',{gt0:true}),wt:nv('f_wt',{gt0:true}),dia:nv('f_dia',{gt0:true}),density:nv('f_den',{req:false}),color:gv('f_color'),note:gv('f_note')};
  if(!f.name)throw new Error('الاسم مطلوب');id?S.fil=S.fil.map(x=>x.id===id?f:x):S.fil.push(f);if(!S.pf.fil)S.pf.fil=f.id;save();render();toast('تم حفظ الخامة');break}
 case'ef':{const f=S.fil.find(x=>x.id===id);$('#main').querySelector('.card').innerHTML='<h3>تعديل خامة</h3>'+filForm(f);break}
 case'df':S.fil=S.fil.filter(x=>x.id!==id);save();render();break;
 case'sp':{const p={id:id||uid(),name:gv('p_name'),w:nv('p_w',{gt0:true}),d:nv('p_d',{gt0:true}),h:nv('p_h',{gt0:true}),nozzle:nv('p_nozzle',{gt0:true}),fd:nv('p_fd',{gt0:true}),watt:nv('p_watt',{req:false}),kwh:nv('p_kwh',{req:false}),prof:gv('p_prof')};
  if(!p.name)throw new Error('الاسم مطلوب');id?S.prn=S.prn.map(x=>x.id===id?p:x):S.prn.push(p);save();render();toast('تم حفظ الطابعة');break}
 case'ep':{$('#main').querySelector('.card').innerHTML='<h3>تعديل طابعة</h3>'+prnForm(S.prn.find(x=>x.id===id));break}
 case'dp':if(S.prn.length<2)throw new Error('يجب بقاء طابعة واحدة على الأقل');S.prn=S.prn.filter(x=>x.id!==id);if(S.pf.prn===id)S.pf.prn=S.prn[0].id;save();render();break;
 case'dh':S.hist=S.hist.filter(x=>x.id!==id);save();render();break;
 case'reuse':{const x=S.hist.find(y=>y.id===id);S.pf={...S.pf,...x.pf};save();go('new');toast('تم تحميل الإعدادات');break}
 case'csv':{const rows=[['الملف','التاريخ','الأبعاد','الخامة','الوزن غ','التكلفة','المصدر']].concat(S.hist.map(x=>[x.name,new Date(x.ts).toISOString(),x.dims,x.fil,x.wTotal.toFixed(1),x.total.toFixed(2),x.source]));dl('history.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');break}
 case'ss':{S.set={theme:gv('s_theme'),cur:gv('s_cur')||'₪',waste:nv('s_waste',{max:100}),kwh:nv('s_kwh'),api:gv('s_api')};save();render();toast('تم حفظ الإعدادات');break}
 case'ping':{S.set.api=gv('s_api');try{await Slicer.health();toast('الخادم متصل')}catch(err){toast('الخادم غير متصل: '+err.message,'e')}break}
 case'exp':dl('p3d-backup.json',JSON.stringify(S),'application/json');break;
 case'imp':$('#impf').click();break;
 case'clr':if(confirm('سيتم مسح كل البيانات نهائيًا. متابعة؟')){localStorage.removeItem(KEY);S=DEF();render();toast('تم المسح')}break;
 case'test':runTests();break;
 }}catch(err){toast(err.message,'e');t.disabled=false}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='file'&&t.files[0])handleFile(t.files[0]);
 if(t.id==='hs'){hs=t.value;render()}
 if(t.id==='impf'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.fil)||!Array.isArray(j.prn)||!Array.isArray(j.hist))throw 0;S={...DEF(),...j};save();render();toast('تم الاستيراد')}catch{toast('ملف النسخة الاحتياطية غير صالح','e')}}
});
document.addEventListener('input',e=>{if(e.target.id==='hq'){hq=e.target.value;const p=e.target.selectionStart;render();const n=$('#hq');n.focus();n.setSelectionRange(p,p)}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('ov',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])}));

/* ===== 8) اختبارات الحساب (من الإعدادات) ===== */
function runTests(){
 const ok=[];const eq=(n,a,b)=>ok.push([n,Math.abs(a-b)<1e-9]);
 eq('سعر الغرام 60/1000',pricePerGram({price:60,wt:1000}),0.06);
 const f={price:60,wt:1000},base={copies:1,mhc:0,extra:0,fix:0},p={watt:100,kwh:''};
 const r=computeCost({w:50,hours:2,f,p,pf:base,set:{waste:10,kwh:0.5}});
 eq('تكلفة الخامة 50غ',r.mat,3);eq('الهدر 10%',r.waste,0.3);eq('كهرباء 100واط×2س×0.5',r.elec,0.1);eq('الإجمالي',r.total,3.4);
 const g=new THREE.BoxGeometry(10,10,10).toNonIndexed();eq('حجم مكعب 10مم = 1000مم³',geoStats(g).vol,1000);
 const bad=ok.filter(x=>!x[1]);toast(bad.length?'فشل: '+bad.map(x=>x[0]).join('، '):'نجحت كل الاختبارات ('+ok.length+')',bad.length?'e':'k');
}
load();render();
</script>
